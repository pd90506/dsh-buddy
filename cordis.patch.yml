# dsh-buddy bundle layer, appended to the profile's bundle stack by
# `dsh plugin --profile <name> add` (via the package's dsh.bundle.patch
# declaration).
#
# The host rows, deliberately separate: the store owns the buddy home and the
# `buddy` storage domain, the persona and skills rows stand on it, and the
# telegram row bridges the bot. Each row has its own effect scope, so a failure
# in one does not take the others down, and any of them can be turned off from a
# profile's own cordis.patch.yml without touching code:
#
#   - id: buddy-persona
#     disabled: true
#
# The browser half is not a row here: it reaches the boot graph through the
# package's `dsh.client` declaration. That declaration is only read for a row
# named exactly `dsh-buddy` (dsh-client-modules skips subpath names like
# `dsh-buddy/store`), which is the sole purpose of the empty `buddy-client` row.
#
# `buddy-telegram` is the Telegram bridge; it idles until enabled from the
# Buddy main panel and refuses to poll while dsh-telegram still holds the bot.
#
# Nothing here does anything on its own. With no SOUL.md written, the plugin
# mounts, registers its settings section and its endpoints, and idles.
- insert:
    - id: buddy-store
      name: 'dsh-buddy/store'
      config: {}
    - id: buddy-persona
      name: 'dsh-buddy/persona'
      config: {}
    - id: buddy-skills
      name: 'dsh-buddy/skills'
      config: {}
    - id: buddy-client
      name: 'dsh-buddy'
      config: {}
    - id: buddy-telegram
      name: 'dsh-buddy/telegram'
      config: {}
